<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Love Alarm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="bg-gradient-to-b from-[#1a0519] via-[#2d0a27] to-[#0d020d] text-white min-h-screen flex flex-col justify-between items-center px-6 py-10 select-none overflow-hidden touch-manipulation relative">

    <!-- Partículas flotantes -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="particle text-pink-400/30 text-xl left-[12%] [animation-duration:14s] [animation-delay:0s]">♥</div>
        <div class="particle text-rose-300/25 text-sm left-[28%] [animation-duration:18s] [animation-delay:3s]">♡</div>
        <div class="particle text-pink-500/20 text-2xl left-[48%] [animation-duration:16s] [animation-delay:1s]">♥</div>
        <div class="particle text-rose-400/30 text-base left-[74%] [animation-duration:12s] [animation-delay:5s]">♥
        </div>
        <div class="particle text-pink-300/20 text-lg left-[88%] [animation-duration:20s] [animation-delay:2s]">♡</div>
    </div>

    <!-- Modal inicial reactivo -->
    <div id="start-overlay"
        class="fixed inset-0 bg-[#0d020d]/95 backdrop-blur-lg z-50 flex flex-col items-center justify-center p-6 text-center">
        <div
            class="w-20 h-20 rounded-full bg-rose-500/20 border border-rose-500/30 flex items-center justify-center mb-5 shadow-[0_0_30px_rgba(244,63,94,0.3)] animate-pulse">
            <svg class="w-10 h-10 text-rose-400" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
        </div>
        <span class="text-xs uppercase tracking-[0.3em] text-pink-300/70 mb-1">Especial para</span>
        <h2 id="modal-user-name" class="serif-title text-3xl italic tracking-wide text-rose-200 mb-3">...</h2>
        <p class="text-xs text-rose-200/70 max-w-xs mb-8 leading-relaxed">
            Esta versión de Love Alarm fue sintonizada para ti. Activa el radar para enviar y recibir señales de amor
            cuando estén cerca.
        </p>
        <button id="start-btn" type="button"
            class="w-full max-w-xs py-4 bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 font-semibold rounded-full shadow-[0_0_30px_rgba(244,63,94,0.5)] active:scale-95 transition-transform text-white text-sm tracking-widest uppercase cursor-pointer">
            Sintonizar radar
        </button>
    </div>

    <!-- Header -->
    <header class="text-center relative z-10 pointer-events-none">
        <h1 id="header-title" class="serif-title text-sm italic tracking-[0.35em] text-pink-200/70 uppercase">Love Alarm
        </h1>
        <p class="text-[11px] text-pink-300/50 mt-1 tracking-widest uppercase">
            Radar de sentimientos activo
        </p>
    </header>

    <!-- Visual Radar -->
    <main class="relative flex items-center justify-center my-auto z-10 pointer-events-none">
        <div class="absolute w-72 h-72 rounded-full border border-pink-400/20 radar-pulse-love"></div>
        <div class="absolute w-72 h-72 rounded-full border border-rose-400/30 radar-pulse-love [animation-delay:1.75s]">
        </div>
        <div class="absolute w-96 h-96 rounded-full border border-pink-300/10 radar-pulse-love [animation-delay:0.8s]">
        </div>

        <div id="outer-glow"
            class="absolute w-80 h-80 rounded-full bg-rose-500/25 blur-3xl transition-all duration-1000 opacity-0">
        </div>

        <div id="radar-core"
            class="relative w-64 h-64 rounded-full bg-gradient-to-b from-white/[0.08] to-white/[0.02] backdrop-blur-2xl border border-rose-300/20 shadow-[0_10px_40px_rgba(0,0,0,0.5)] flex flex-col items-center justify-center transition-all duration-700">
            <svg id="heart-svg" class="w-14 h-14 text-rose-200/30 transition-all duration-500" viewBox="0 0 24 24"
                fill="currentColor">
                <path
                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
            <span id="count-display"
                class="text-6xl font-light tracking-tight mt-1 transition-all duration-500 text-rose-100/60">0</span>
        </div>
    </main>

    <!-- Heart ID Tag -->
    <div class="text-center my-1 pointer-events-none relative z-10">
        <span id="heart-id-display"
            class="text-xs text-rose-200/50 tracking-wider underline underline-offset-4 decoration-rose-300/30">
            Heart ID : ...
        </span>
    </div>

    <!-- Estado del radar -->
    <p id="status-text"
        class="serif-title italic text-sm text-pink-200/70 leading-relaxed transition-all duration-500 text-center max-w-xs relative z-10 pointer-events-none">
        Sintonizando radar...
    </p>

    <!-- Botón interactivo para enviar señal de amor -->
    <footer class="w-full max-w-xs flex flex-col items-center gap-2 mt-4 relative z-20">
        <button id="send-love-btn" type="button"
            class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-pink-500/20 via-rose-500/30 to-pink-500/20 border border-pink-400/40 text-pink-200 text-xs font-semibold uppercase tracking-widest flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(244,63,94,0.15)] active:scale-95 transition-all cursor-pointer">
            <span class="text-rose-400 text-base animate-pulse">💓</span>
            <span id="send-btn-text">Hacer sonar su corazón</span>
        </button>
        <p id="send-feedback" class="text-[11px] text-pink-300 h-4 font-medium transition-opacity duration-300"></p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
