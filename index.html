<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Alarm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        @keyframes radarWave {
            0% {
                transform: scale(0.9);
                opacity: 0.8;
            }

            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        .radar-pulse {
            animation: radarWave 3s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
        }
    </style>
</head>

<body
    class="bg-gradient-to-b from-sky-950 via-slate-900 to-[#070b19] text-white min-h-screen flex flex-col justify-between items-center px-6 py-12 select-none overflow-hidden touch-manipulation">

    <header class="text-center">
        <h1 class="text-xs uppercase tracking-[0.4em] font-medium text-sky-200/60">Love Alarm</h1>
        <p id="hint-text" class="text-[11px] text-pink-300/80 mt-2 tracking-wide animate-pulse">
            Toca la pantalla una vez para sintonizar el radar
        </p>
    </header>

    <main class="relative flex items-center justify-center my-auto">
        <div class="absolute w-72 h-72 rounded-full border border-sky-400/20 radar-pulse pointer-events-none"></div>
        <div
            class="absolute w-72 h-72 rounded-full border border-rose-400/20 radar-pulse [animation-delay:1.5s] pointer-events-none">
        </div>
        <div id="outer-glow"
            class="absolute w-80 h-80 rounded-full bg-rose-500/20 blur-2xl transition-opacity duration-700 opacity-0 pointer-events-none">
        </div>

        <div
            class="relative w-60 h-60 rounded-full bg-slate-900/50 backdrop-blur-xl border border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] flex flex-col items-center justify-center z-10 transition-all duration-500">
            <svg id="heart-svg" class="w-12 h-12 text-white/30 transition-all duration-500 transform"
                viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
            <span id="count-display"
                class="text-6xl font-extralight tracking-tight mt-1 transition-all duration-500">0</span>
        </div>
    </main>

    <footer class="text-center max-w-xs">
        <p id="status-text" class="text-sm text-slate-400/90 leading-relaxed transition-all duration-300">
            Buscando en un radio de 10 metros...
        </p>
    </footer>

    <script>
        const FIREBASE_URL = "https://love-alarm-fff53-default-rtdb.firebaseio.com/alarmTrigger.json";

        let audioCtx = null;
        function playChime() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                [587.33, 880].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.12));
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + (i * 0.12));
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i * 0.12) + 0.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + (i * 0.12));
                    osc.stop(audioCtx.currentTime + (i * 0.12) + 0.8);
                });
            } catch (e) {
                console.warn(e);
            }
        }

        document.body.addEventListener("click", () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById("hint-text").style.opacity = "0";
        }, { once: true });

        let lastState = false;

        async function checkStatus() {
            try {
                const res = await fetch(FIREBASE_URL);
                const active = await res.json();

                const countEl = document.getElementById("count-display");
                const statusText = document.getElementById("status-text");
                const heartIcon = document.getElementById("heart-svg");
                const outerRing = document.getElementById("outer-glow");

                if (active === true || active === "true") {
                    countEl.textContent = "1";
                    countEl.classList.add("text-rose-400", "scale-110");
                    statusText.textContent = "¡Alguien a quien le gustas está a menos de 10 m!";
                    statusText.classList.add("text-rose-300", "font-medium");
                    heartIcon.classList.remove("text-white/30");
                    heartIcon.classList.add("text-rose-500", "drop-shadow-[0_0_20px_rgba(244,63,94,0.9)]");
                    outerRing.classList.remove("opacity-0");
                    outerRing.classList.add("opacity-100");

                    if (!lastState) {
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                        playChime();
                    }
                    lastState = true;
                } else {
                    countEl.textContent = "0";
                    countEl.classList.remove("text-rose-400", "scale-110");
                    statusText.textContent = "Buscando en un radio de 10 metros...";
                    statusText.classList.remove("text-rose-300", "font-medium");
                    heartIcon.classList.add("text-white/30");
                    heartIcon.classList.remove("text-rose-500", "drop-shadow-[0_0_20px_rgba(244,63,94,0.9)]");
                    outerRing.classList.remove("opacity-100");
                    outerRing.classList.add("opacity-0");
                    lastState = false;
                }
            } catch (err) {
                console.warn("Sondeo Firebase:", err);
            }
        }

        // Consulta el estado cada 1 segundo
        setInterval(checkStatus, 1000);
        checkStatus();
    </script>
</body>

</html>
